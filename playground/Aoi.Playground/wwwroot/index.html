<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Aoi language playground — run Aoi in the browser." />
    <title>Aoi Playground</title>
    <!-- BASE_HREF: replaced in CI for GitHub Pages project sites -->
    <base href="/" />
    <script>
      // Restore deep links saved by 404.html (GitHub Pages SPA fallback).
      (function () {
        try {
          var redirect = sessionStorage.getItem('aoi:redirect');
          if (!redirect) return;
          sessionStorage.removeItem('aoi:redirect');
          var url = new URL(redirect, window.location.href);
          if (url.origin !== window.location.origin) return;
          var base = (document.querySelector('base')?.getAttribute('href') || '/');
          var basePath = base.endsWith('/') ? base.slice(0, -1) : base;
          if (basePath && url.pathname !== basePath && url.pathname.indexOf(basePath + '/') !== 0) return;
          history.replaceState(null, '', url.pathname + url.search + url.hash);
        } catch (e) { /* ignore */ }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet" />
    <!-- ASSET_V: rewritten in CI to the deploy commit so browsers do not keep stale css/js -->
    <link rel="stylesheet" href="css/app.css?v=dev" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%230b1c33'/%3E%3Ccircle cx='32' cy='32' r='10' fill='%23f0b429'/%3E%3C/svg%3E" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('aoi-theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
</head>

<body>
    <div id="app">
        <div class="boot">
            <div class="boot-mark" aria-hidden="true"></div>
            <p class="boot-title">Aoi</p>
            <p class="boot-sub">loading playground…</p>
        </div>
    </div>

    <div id="blazor-error-ui">
        Something went wrong.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">×</a>
    </div>
    <script src="js/playground.js?v=dev"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
